version: '3.8'
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: --model /models/llama2-70b-dpo --tensor-parallel-size 4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    ports:
      - "8000:8000"
      
  kong:
    image: kong:3.5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
    volumes:
      - ./kong.yml:/kong/kong.yml
    ports:
      - "8001:8000"
      - "8002:8001"
      
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
      
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana_dashboard.json:/etc/grafana/provisioning/dashboards/llm.json
    ports:
      - "3000:3000"
      
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
