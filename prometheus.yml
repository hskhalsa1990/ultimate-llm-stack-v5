global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'vllm'
    static_configs:
      - targets: ['vllm-service:8000']
    metrics_path: /metrics
    
  - job_name: 'ray'
    static_configs:
      - targets: ['ray-head:8080']
      
  - job_name: 'gpu-metrics'
    static_configs:
      - targets: ['dcgm-exporter:9400']
      
  - job_name: 'moe-metrics'
    static_configs:
      - targets: ['moe-exporter:9090']
