replicaCount: 4

image:
  repository: llm-stack
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 80Gi
    cpu: 16
  requests:
    nvidia.com/gpu: 1
    memory: 64Gi
    cpu: 8

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

vllm:
  model: /models/llama2-70b-dpo
  tensorParallelSize: 4
  maxModelLen: 32768
  dtype: bfloat16
  enableChunkedPrefill: true

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
